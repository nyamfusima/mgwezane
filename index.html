    <script>
      // The hero vehicle only renders on the home page, so preloading it on
      // /rates would download it for nothing. Injected rather than hard-coded
      // because both routes share this one document.
      (function () {
        if (location.pathname.replace(/\/+$/, '') === '/rates') return
        var wide = window.matchMedia('(min-width: 768px)').matches
        var link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'image'
        link.href = wide ? '/assets/hero/hero-poster.webp' : '/assets/hero/hero-poster-mobile.webp'
        document.head.appendChild(link)
      })()
    </script>
